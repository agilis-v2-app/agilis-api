kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.34.0
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 27017
        hostPort: 27017
        protocol: TCP
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
